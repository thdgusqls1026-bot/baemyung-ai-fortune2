<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>행운숫자 순위 · 운영자</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/admin.js" defer></script>
</head>
<body>
  <main class="shell wide">
    <section class="panel" id="loginPanel">
      <div class="step-label">ADMIN <span>RANKING</span></div>
      <h2>행운숫자 순위 (운영자 전용)</h2>
      <p class="description">운영자 비밀번호를 입력하면 창의성 점수 순위를 볼 수 있어요.</p>
      <form id="loginForm" class="admin-form">
        <input id="passwordInput" type="password" autocomplete="current-password" placeholder="운영자 비밀번호" required>
        <button class="action-button" type="submit">순위 보기</button>
      </form>
      <p class="error-message hidden" id="adminError" role="alert"></p>
    </section>

    <section class="panel hidden" id="rankingPanel">
      <div class="step-label">RANKING <span id="totalCount"></span></div>
      <h2>행운숫자 순위</h2>
      <div id="storageWarn" class="admin-warn hidden"></div>
      <div class="admin-bar">
        <button id="refreshBtn" class="outline-button" type="button">↻ 새로고침</button>
        <button id="csvBtn" class="outline-button" type="button">⬇ CSV 저장</button>
      </div>
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead><tr><th>순위</th><th>확인 코드</th><th>행운숫자</th><th>구도</th><th>아이디어</th><th>표현</th><th>재미</th><th>종류</th><th>제출 시각</th></tr></thead>
          <tbody id="rankingBody"></tbody>
        </table>
      </div>
      <p class="important-note">동점이면 아이디어 → 표현 → 구도 → 재미 점수 순, 그래도 같으면 먼저 제출한 순서로 순위를 정해요. 수상자는 확인 코드와 실물 영수증을 함께 확인해 주세요.</p>
      <p class="important-note" id="networkInfo"></p>
      <p class="error-message hidden" id="rankingError" role="alert"></p>
    </section>
  </main>
</body>
</html>
